name: R34 protected production recovery
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Review rehearsal only, or owner-gated capture
        required: true
        type: choice
        default: review
        options: [review, capture]
      approved_sha:
        description: Exact reviewed automation commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: r34-production-recovery
  cancel-in-progress: false
jobs:
  source-review:
    if: github.repository == 'abdallahjawadk-code/medistock-r33-cloud-test' && github.actor == 'abdallahjawadk-code' && github.triggering_actor == 'abdallahjawadk-code' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.sha == vars.R34_APPROVED_SHA && inputs.approved_sha == github.sha && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R34_APPROVED_SHA: ${{ vars.R34_APPROVED_SHA }}
      R34_INPUT_SHA: ${{ inputs.approved_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: abdallahjawadk-code/medistock-phoenix
          ref: 0b5f1226591e6eea5408f9603e29e3e8890b15bb
          path: app
          persist-credentials: false
      - name: Verify new trust, TLS, quota and identity guards
        run: node --test r34/policy.test.mjs r34/recovery-crypto.test.mjs r34/restore-roles.test.mjs r34/source-contract.test.mjs
      - name: Reconstruct exact thirteen source files without executing SQL
        run: node r34/verify-preparation.mjs
      - name: Rehearse exact archive restore and Vault with synthetic data only
        run: node r34/rehearsal.mjs
  capture-and-restore:
    needs: source-review
    if: needs.source-review.result == 'success' && inputs.operation == 'capture'
    environment: r34-production-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: abdallahjawadk-code/medistock-phoenix
          ref: 0b5f1226591e6eea5408f9603e29e3e8890b15bb
          path: app
          persist-credentials: false
      - name: Install lockfile-pinned database client without lifecycle scripts
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: One read-only capture and exact isolated restore; no hosted SQL changes
        run: node r34/recovery-run.mjs
        env:
          R34_APPROVED_SHA: ${{ vars.R34_APPROVED_SHA }}
          R34_INPUT_SHA: ${{ inputs.approved_sha }}
          R34_DB_HOST: ${{ secrets.R34_DB_HOST }}
          R34_DB_USER: ${{ secrets.R34_DB_USER }}
          R34_DB_PASSWORD: ${{ secrets.R34_DB_PASSWORD }}
          R34_DB_CA_PEM: ${{ secrets.R34_DB_CA_PEM }}
          R34_STORAGE_READ_KEY: ${{ secrets.R34_STORAGE_READ_KEY }}
          R34_BACKUP_PUBLIC_KEY_PEM: ${{ secrets.R34_BACKUP_PUBLIC_KEY_PEM }}
          R34_BACKUP_PRIVATE_KEY_PEM: ${{ secrets.R34_BACKUP_PRIVATE_KEY_PEM }}
          R34_R2_PUT_URL: ${{ secrets.R34_R2_PUT_URL }}
          R34_R2_GET_URL: ${{ secrets.R34_R2_GET_URL }}
          R34_QUOTA_RECEIPT_JSON: ${{ secrets.R34_QUOTA_RECEIPT_JSON }}
          R34_EXTERNAL_RECOVERY_BUNDLE_JSON: ${{ secrets.R34_EXTERNAL_RECOVERY_BUNDLE_JSON }}
